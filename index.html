<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Connectify" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090f" />
    <script>
      // Apply the saved theme before anything paints, so there is no flash.
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('cx_theme');
          theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f5fb');
        }
      })();
    </script>
    <title>Connectify – Share moments with your people</title>
    <meta name="description" content="Connectify is a social app for sharing photos and updates, adding friends and messaging the people who matter." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Connectify" />
    <meta property="og:title" content="Connectify – Share moments with your people" />
    <meta property="og:description" content="Share photos and updates, add friends and message the people who matter." />
    <meta property="og:url" content="https://connectifysocialmedia.netlify.app/" />
    <meta property="og:image" content="https://connectifysocialmedia.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
